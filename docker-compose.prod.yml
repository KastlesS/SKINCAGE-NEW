secrets:
  secret_key:
    file: ./secrets/secret_key.txt
  db_password:
    file: ./secrets/db_password.txt

services:
  db:
    container_name: skincage_db
    image: postgres:15-alpine
    volumes:
      - db_volume:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: skincage_db
      POSTGRES_USER: skincage_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - skincage_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skincage_user -d skincage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    container_name: skincage_migrate
    image: kastles/skincage:latest
    entrypoint: []
    command: python skincage/manage.py migrate --noinput
    environment:
      - DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=skincage_db
      - DB_USER=skincage_user
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=skincage.online,www.skincage.online
    secrets:
      - secret_key
      - db_password
    networks:
      - skincage_net
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    container_name: skincage_web
    image: kastles/skincage:latest
    volumes:
      - static_volume:/code/skincage/staticfiles
      - media_volume:/code/skincage/media
      - ./scripts:/scripts
    environment:
      - DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=skincage_db
      - DB_USER=skincage_user
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=skincage.online,www.skincage.online
      # Google OAuth2 — rellenar con las claves de Google Cloud Console
      - SOCIAL_AUTH_GOOGLE_OAUTH2_KEY=${SOCIAL_AUTH_GOOGLE_OAUTH2_KEY}
      - SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET=${SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET}
      # Stripe — usar claves de TEST (pk_test_... / sk_test_...)
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - FRONTEND_URL=https://skincage.online
    secrets:
      - secret_key
      - db_password
    networks:
      - skincage_net
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    container_name: skincage_nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/code/skincage/staticfiles:ro
      - media_volume:/code/skincage/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - skincage_net
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  db_volume:

networks:
  skincage_net:
    driver: bridge
