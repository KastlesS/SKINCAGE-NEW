<header class="cabecera">
  <div class="header-container">
    <div class="logo">
      <h1><a href="{% url 'home' %}">SkinCage</a></h1>
    </div>

    <!-- Botón hamburguesa (visible solo en mobile vía CSS) -->
    <button class="hamburger" id="hamburger-btn" aria-label="Abrir menú" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-wrapper" id="nav-wrapper">
      <nav id="navbar">
        <ul>
          <li><a href="{% url 'home' %}" class="nav-link">Home</a></li>
          <li><a href="{% url 'skins' %}" class="nav-link">Mercado</a></li>

          {% if user.is_authenticated %}
          <li><a href="{% url 'perfil' %}" class="nav-link">Perfil</a></li>
          {% if user.is_staff %}
          <li>
            <a
              href="{% url 'admin_panel' %}"
              class="nav-link"
              style="color: #f39c12"
              >Panel Admin</a
            >
          </li>
          {% endif %} {% endif %}
        </ul>
      </nav>

      <div class="auth-actions">
        {% if not user.is_authenticated %}
        <a href="{% url 'login' %}" class="btn-auth">Iniciar Sesión</a>
        {% else %}
        <form action="{% url 'logout' %}" method="post" class="logout-form">
          {% csrf_token %}
          <button type="submit" class="btn-auth btn-logout">Logout</button>
        </form>
        {% endif %}
      </div>
    </div>
  </div>
</header>

<script>
  (function () {
    var btn = document.getElementById('hamburger-btn');
    var nav = document.getElementById('nav-wrapper');
    if (!btn || !nav) return;

    btn.addEventListener('click', function () {
      var isOpen = nav.classList.toggle('is-open');
      btn.classList.toggle('is-active', isOpen);
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    // Cierra el menú al hacer clic en un enlace interno
    nav.querySelectorAll('.nav-link').forEach(function (link) {
      link.addEventListener('click', function () {
        nav.classList.remove('is-open');
        btn.classList.remove('is-active');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>
