{% extends "portfolio/base.html" %} {% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/form.css' %}" />
<link rel="stylesheet" href="{% static 'css/recuperacion.css' %}" />
{% endblock %}

{% block content %}
<div class="tarjeta-error">
  <span class="icono-error-grande">⏱️</span>
  <h1 class="titulo-error-token">Enlace inválido o caducado</h1>
  <p class="texto-error-token">
    El enlace de recuperación no es válido o ha expirado.<br>
    Los enlaces son válidos durante <strong style="color: #c4b5fd">1 hora</strong>.
  </p>
  <a href="{% url 'recuperar_contrasena' %}" class="btn-enviar" style="display: block; text-align: center; text-decoration: none; color: #fff; padding: 0.7rem; border-radius: 10px; background: linear-gradient(135deg, #6d28d9, #8b5cf6); font-weight: 600;">
    Solicitar nuevo enlace
  </a>
  <div class="enlace-login" style="margin-top: 1.2rem; font-size: 0.85rem; color: #6060a8;">
    <a href="{% url 'login' %}" style="color: #a78bfa; text-decoration: none;">← Volver al login</a>
  </div>
</div>
{% endblock %}
